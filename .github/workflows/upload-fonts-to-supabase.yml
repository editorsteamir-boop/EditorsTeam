name: Upload Fonto Fonts to Supabase

on:
  workflow_dispatch:
    inputs:
      source_bucket:
        description: Bucket containing the one-time migration ZIP
        required: false
        default: fonto-fonts
      source_object:
        description: Object path of the migration ZIP
        required: false
        default: migration/Fonto-Web-Pro-Final-Functional.zip
      cleanup_source:
        description: Remove migration ZIP after successful upload
        required: false
        default: true
        type: boolean

jobs:
  upload-fonts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install --no-save @supabase/supabase-js adm-zip ws

      - name: Upload fonts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SOURCE_BUCKET: ${{ inputs.source_bucket }}
          SOURCE_OBJECT: ${{ inputs.source_object }}
          CLEANUP_SOURCE: ${{ inputs.cleanup_source }}
          TARGET_BUCKET: fonto-fonts
        run: node scripts/upload-fonts-to-supabase.js
